name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

concurrency:
  # Cancel intermediate builds on PRs, but allow them to complete on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Explicit job list rather than a Cartesian product: the minimum
        # supported Julia version is checked on Linux only, and the latest
        # stable 1.x release is checked on all three operating systems.
        include:
          - version: '1.11'        # Minimum supported Julia version
            os: ubuntu-latest
            arch: x64
          - version: '1'           # Latest stable Julia 1.x release
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: windows-latest
            arch: x64
          - version: '1'
            os: macos-latest
            arch: x64

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
